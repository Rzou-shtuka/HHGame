<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#174c35" />
  <title>HOUHOU GAME</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0b2e21, #236447 58%, #2d7654);
    }

    .loading-card {
      width: min(420px, calc(100% - 40px));
      padding: 28px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 24px;
      text-align: center;
      background: rgba(11,46,33,.55);
      box-shadow: 0 20px 60px rgba(0,0,0,.22);
      backdrop-filter: blur(14px);
    }

    .loading-card h1 { margin: 0 0 8px; }
    .loading-card p { margin: 0; color: rgba(255,255,255,.72); }
  </style>
</head>
<body>
  <div class="loading-card" id="loadingCard">
    <h1>HOUHOU GAME</h1>
    <p>正在加载游戏……</p>
  </div>

  <script>
    (async function loadGame() {
      try {
        const response = await fetch("./game-source.html", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const source = await response.text();
        const parsed = new DOMParser().parseFromString(source, "text/html");
        const originalScripts = [...parsed.querySelectorAll("script")];
        originalScripts.forEach((script) => script.remove());

        document.title = parsed.title || "HOUHOU GAME";
        document.head.querySelectorAll("style").forEach((style) => style.remove());
        parsed.head.querySelectorAll("style").forEach((style) => {
          document.head.appendChild(style.cloneNode(true));
        });

        document.body.className = parsed.body.className;
        document.body.innerHTML = parsed.body.innerHTML;

        const milestoneStyle = document.createElement("style");
        milestoneStyle.textContent = `
          .milestone-section {
            margin-top: 22px;
            padding: 22px;
            border: 1px solid rgba(255,255,255,.25);
            border-radius: var(--radius-xl);
            background: rgba(248,251,247,.96);
            box-shadow: var(--shadow);
          }

          .milestone-heading { margin-bottom: 16px; }
          .milestone-heading h2 { margin: 0; font-size: 1.2rem; }
          .milestone-heading p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: .88rem;
          }

          .milestone-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 13px;
          }

          .milestone-card {
            position: relative;
            overflow: hidden;
            min-height: 190px;
            padding: 20px;
            border: 1px solid rgba(23,76,53,.13);
            border-radius: var(--radius-lg);
            background: var(--white);
            box-shadow: 0 5px 16px rgba(18,61,44,.055);
            transition: transform 220ms ease, border-color 220ms ease,
              box-shadow 220ms ease, background 220ms ease;
          }

          .milestone-card::after {
            content: "";
            position: absolute;
            width: 105px;
            height: 105px;
            right: -45px;
            bottom: -50px;
            border-radius: 50%;
            background: rgba(50,129,92,.08);
          }

          .milestone-card.is-unlocked {
            transform: translateY(-3px);
            border-color: var(--gold);
            background: linear-gradient(145deg, #fffdf7, var(--green-100));
            box-shadow: 0 13px 30px rgba(18,61,44,.14);
          }

          .milestone-badge {
            display: inline-flex;
            align-items: center;
            margin-bottom: 13px;
            padding: 7px 10px;
            border-radius: 999px;
            color: var(--muted);
            font-size: .75rem;
            font-weight: 900;
            background: #eef3f0;
          }

          .milestone-card.is-unlocked .milestone-badge {
            color: #5d4311;
            background: #fff0c8;
          }

          .milestone-card h3 {
            margin: 0 0 9px;
            color: var(--green-900);
            font-size: 1.05rem;
          }

          .milestone-card p {
            position: relative;
            z-index: 1;
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
          }

          .milestone-card.is-unlocked p { color: #315044; }

          .milestone-state {
            display: block;
            margin-top: 14px;
            color: var(--muted);
            font-size: .76rem;
            font-weight: 800;
          }

          .milestone-card.is-unlocked .milestone-state {
            color: var(--green-700);
          }

          @media (max-width: 920px) {
            .milestone-grid { grid-template-columns: 1fr; }
            .milestone-card { min-height: 0; }
          }

          @media (max-width: 620px) {
            .milestone-section {
              padding: 16px;
              border-radius: 20px;
            }
          }
        `;
        document.head.appendChild(milestoneStyle);

        const footer = document.querySelector(".footer-note");
        const milestoneSection = document.createElement("section");
        milestoneSection.className = "milestone-section";
        milestoneSection.id = "milestoneSection";
        milestoneSection.setAttribute("aria-labelledby", "milestoneTitle");
        milestoneSection.innerHTML = `
          <div class="milestone-heading">
            <h2 id="milestoneTitle">通关结果</h2>
            <p>每完成一些问题，就会解锁一段新的结果。</p>
          </div>
          <div class="milestone-grid">
            <article class="milestone-card" data-threshold="3">
              <span class="milestone-badge">3 个问题</span>
              <h3>特别通关</h3>
              <p>当你成功回答 3 个问题，并且因为这个游戏感到一些快乐的时候，恭喜你，你成为了这世界上唯一一个通关的人哟。</p>
              <span class="milestone-state">再完成 3 个问题即可解锁</span>
            </article>
            <article class="milestone-card" data-threshold="7">
              <span class="milestone-badge">7 个问题</span>
              <h3>奖励解锁</h3>
              <p>当你成功回答 7 个问题，你就能解锁一个奖励：Demo7 背后的小故事。</p>
              <span class="milestone-state">再完成 7 个问题即可解锁</span>
            </article>
            <article class="milestone-card" data-threshold="12">
              <span class="milestone-badge">12 个问题</span>
              <h3>完美通关</h3>
              <p>当你成功回答 12 个问题，你就能完美通关，并得到一个关于彩蛋的提示。</p>
              <span class="milestone-state">再完成 12 个问题即可解锁</span>
            </article>
          </div>
        `;

        if (footer && footer.parentNode) {
          footer.parentNode.insertBefore(milestoneSection, footer);
        } else {
          document.querySelector("main")?.appendChild(milestoneSection);
        }

        for (const oldScript of originalScripts) {
          const script = document.createElement("script");
          if (oldScript.src) {
            script.src = oldScript.src;
          } else {
            script.textContent = oldScript.textContent;
          }
          document.body.appendChild(script);
        }

        function updateMilestones() {
          const completed = document.querySelectorAll(".question-card.is-complete").length;
          document.querySelectorAll(".milestone-card").forEach((card) => {
            const threshold = Number(card.dataset.threshold);
            const remaining = Math.max(0, threshold - completed);
            const unlocked = completed >= threshold;
            card.classList.toggle("is-unlocked", unlocked);
            card.querySelector(".milestone-state").textContent = unlocked
              ? "✓ 已解锁"
              : `再完成 ${remaining} 个问题即可解锁`;
          });
        }

        if (typeof window.updateCounters === "function") {
          const originalUpdateCounters = window.updateCounters;
          window.updateCounters = function () {
            originalUpdateCounters();
            updateMilestones();
          };
        }

        document.addEventListener("click", (event) => {
          if (event.target.closest(".complete-button") || event.target.closest("#resetButton")) {
            setTimeout(updateMilestones, 0);
          }
        });

        updateMilestones();
      } catch (error) {
        document.body.innerHTML = `
          <div class="loading-card">
            <h1>加载失败</h1>
            <p>请刷新页面重试。${String(error.message || error)}</p>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
