name: Enable answer review

on:
  push:
    paths:
      - '.github/workflows/enable-answer-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load answer review script
        shell: python
        run: |
          from pathlib import Path

          page = Path("index.html")
          text = page.read_text(encoding="utf-8")
          marker = '''        function updateMilestones() {'''
          addition = '''        const answerReviewScript = document.createElement("script");
        answerReviewScript.src = "./answer-review.js";
        document.body.appendChild(answerReviewScript);

'''

          if 'answerReviewScript.src = "./answer-review.js"' not in text:
              if marker not in text:
                  raise RuntimeError("Insertion point not found")
              text = text.replace(marker, addition + marker, 1)
              page.write_text(text, encoding="utf-8")

          Path(".github/workflows/enable-answer-review.yml").unlink(missing_ok=True)

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/enable-answer-review.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Enable answer saving and manual review"
            git push
          fi
