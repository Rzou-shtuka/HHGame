name: Add result milestones

on:
  push:
    paths:
      - '.github/workflows/add-result-milestones.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add result milestone section
        shell: python
        run: |
          from pathlib import Path

          page = Path("index.html")
          text = page.read_text(encoding="utf-8")

          if 'id="milestoneSection"' not in text:
              css_anchor = "    @keyframes reveal {"
              css = r'''    .milestone-section {
      margin-top: 22px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: var(--radius-xl);
      background: rgba(248, 251, 247, 0.96);
      box-shadow: var(--shadow);
    }

    .milestone-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .milestone-heading h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .milestone-heading p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .milestone-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 13px;
    }

    .milestone-card {
      position: relative;
      overflow: hidden;
      min-height: 190px;
      padding: 20px;
      border: 1px solid rgba(23, 76, 53, 0.13);
      border-radius: var(--radius-lg);
      background: var(--white);
      box-shadow: 0 5px 16px rgba(18, 61, 44, 0.055);
      transition: transform 220ms ease, border-color 220ms ease, box-shadow 220ms ease, background 220ms ease;
    }

    .milestone-card::after {
      content: "";
      position: absolute;
      width: 105px;
      height: 105px;
      right: -45px;
      bottom: -50px;
      border-radius: 50%;
      background: rgba(50, 129, 92, 0.08);
    }

    .milestone-card.is-unlocked {
      transform: translateY(-3px);
      border-color: var(--gold);
      background: linear-gradient(145deg, #fffdf7, var(--green-100));
      box-shadow: 0 13px 30px rgba(18, 61, 44, 0.14);
    }

    .milestone-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 13px;
      padding: 7px 10px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 900;
      background: #eef3f0;
    }

    .milestone-card.is-unlocked .milestone-badge {
      color: #5d4311;
      background: #fff0c8;
    }

    .milestone-card h3 {
      margin: 0 0 9px;
      color: var(--green-900);
      font-size: 1.05rem;
    }

    .milestone-card p {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .milestone-card.is-unlocked p {
      color: #315044;
    }

    .milestone-state {
      display: block;
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
    }

    .milestone-card.is-unlocked .milestone-state {
      color: var(--green-700);
    }

    @media (max-width: 920px) {
      .milestone-grid {
        grid-template-columns: 1fr;
      }

      .milestone-card {
        min-height: 0;
      }
    }

    @media (max-width: 620px) {
      .milestone-section {
        padding: 16px;
        border-radius: 20px;
      }
    }

'''
              if css_anchor not in text:
                  raise RuntimeError("CSS insertion point not found")
              text = text.replace(css_anchor, css + css_anchor, 1)

              html_anchor = '''    </section>

    <p class="footer-note">'''
              html = '''    </section>

    <section class="milestone-section" id="milestoneSection" aria-labelledby="milestoneTitle">
      <div class="milestone-heading">
        <div>
          <h2 id="milestoneTitle">通关结果</h2>
          <p>每完成一些问题，就会解锁一段新的结果。</p>
        </div>
      </div>

      <div class="milestone-grid">
        <article class="milestone-card" data-threshold="3">
          <span class="milestone-badge">3 个问题</span>
          <h3>特别通关</h3>
          <p>当你成功回答 3 个问题，并且因为这个游戏感到一些快乐的时候，恭喜你，你成为了这世界上唯一一个通关的人哟。</p>
          <span class="milestone-state">再完成 3 个问题即可解锁</span>
        </article>

        <article class="milestone-card" data-threshold="7">
          <span class="milestone-badge">7 个问题</span>
          <h3>奖励解锁</h3>
          <p>当你成功回答 7 个问题，你就能解锁一个奖励：Demo7 背后的小故事。</p>
          <span class="milestone-state">再完成 7 个问题即可解锁</span>
        </article>

        <article class="milestone-card" data-threshold="12">
          <span class="milestone-badge">12 个问题</span>
          <h3>完美通关</h3>
          <p>当你成功回答 12 个问题，你就能完美通关，并得到一个关于彩蛋的提示。</p>
          <span class="milestone-state">再完成 12 个问题即可解锁</span>
        </article>
      </div>
    </section>

    <p class="footer-note">'''
              if html_anchor not in text:
                  raise RuntimeError("HTML insertion point not found")
              text = text.replace(html_anchor, html, 1)

              js_anchor = '''      hintCounter.textContent = `已打开 ${openedHints.size}`;
    }'''
              js = '''      hintCounter.textContent = `已打开 ${openedHints.size}`;

      document.querySelectorAll(".milestone-card").forEach((card) => {
        const threshold = Number(card.dataset.threshold);
        const state = card.querySelector(".milestone-state");
        const remaining = Math.max(0, threshold - completedQuestions.size);
        const unlocked = completedQuestions.size >= threshold;

        card.classList.toggle("is-unlocked", unlocked);
        state.textContent = unlocked
          ? "✓ 已解锁"
          : `再完成 ${remaining} 个问题即可解锁`;
      });
    }'''
              if js_anchor not in text:
                  raise RuntimeError("JavaScript insertion point not found")
              text = text.replace(js_anchor, js, 1)

              page.write_text(text, encoding="utf-8")

          Path(".github/workflows/add-result-milestones.yml").unlink(missing_ok=True)

      - name: Commit updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-result-milestones.yml
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Add result milestones to HOUHOU game"
            git push
          fi
